# Build + run both apps. Run from this directory:
# `docker compose --env-file ../.env up -d --build`.
# NEXT_PUBLIC_* values are baked at build time via build args (see each Dockerfile);
# set them in the repo-root .env or the host environment before building for production.

services:
  bridge:
    build:
      context: ..
      dockerfile: apps/bridge/Dockerfile
      args:
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
        NEXT_PUBLIC_BRIDGE_PROGRAM_ID: ${NEXT_PUBLIC_BRIDGE_PROGRAM_ID:-EzBkC8P5wxab9kwrtV5hRdynHAfB5w3UPcPXNgMseVA8}
        NEXT_PUBLIC_JUPITER_API_KEY: ${NEXT_PUBLIC_JUPITER_API_KEY:-}
        NEXT_PUBLIC_JUPITER_REFERRAL_ACCOUNT: ${NEXT_PUBLIC_JUPITER_REFERRAL_ACCOUNT:-}
        NEXT_PUBLIC_JUPITER_REFERRAL_FEE: ${NEXT_PUBLIC_JUPITER_REFERRAL_FEE:-}
    image: wxmr-bridge
    restart: unless-stopped
    ports:
      # Bind to loopback; Nginx (or Tor) on the host proxies to it.
      - "127.0.0.1:3000:3000"

  swap:
    build:
      context: ..
      dockerfile: apps/swap/Dockerfile
      args:
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
        NEXT_PUBLIC_JUPITER_API_KEY: ${NEXT_PUBLIC_JUPITER_API_KEY:-}
        NEXT_PUBLIC_ORCHESTRATOR_URL: ${NEXT_PUBLIC_ORCHESTRATOR_URL:-/api}
        NEXT_PUBLIC_ETHEREUM_RPC_URL: ${NEXT_PUBLIC_ETHEREUM_RPC_URL:-}
        NEXT_PUBLIC_BASE_RPC_URL: ${NEXT_PUBLIC_BASE_RPC_URL:-}
        NEXT_PUBLIC_BSC_RPC_URL: ${NEXT_PUBLIC_BSC_RPC_URL:-}
        NEXT_PUBLIC_ARBITRUM_RPC_URL: ${NEXT_PUBLIC_ARBITRUM_RPC_URL:-}
        NEXT_PUBLIC_OPTIMISM_RPC_URL: ${NEXT_PUBLIC_OPTIMISM_RPC_URL:-}
        NEXT_PUBLIC_POLYGON_RPC_URL: ${NEXT_PUBLIC_POLYGON_RPC_URL:-}
        NEXT_PUBLIC_AVALANCHE_RPC_URL: ${NEXT_PUBLIC_AVALANCHE_RPC_URL:-}
        NEXT_PUBLIC_LINEA_RPC_URL: ${NEXT_PUBLIC_LINEA_RPC_URL:-}
        NEXT_PUBLIC_HYPEREVM_RPC_URL: ${NEXT_PUBLIC_HYPEREVM_RPC_URL:-}
        NEXT_PUBLIC_MONAD_RPC_URL: ${NEXT_PUBLIC_MONAD_RPC_URL:-}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    image: wxmr-swap
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"

  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    image: wxmr-orchestrator
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ORCH_HOST: 0.0.0.0
      ORCH_PORT: 3002
      ORCH_DB_PATH: /data/orchestrator.sqlite
      SOLANA_HOTWALLET_SECRET: ${SOLANA_HOTWALLET_SECRET:?SOLANA_HOTWALLET_SECRET is required}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      BRIDGE_PROGRAM_ID: ${BRIDGE_PROGRAM_ID:-EzBkC8P5wxab9kwrtV5hRdynHAfB5w3UPcPXNgMseVA8}
      SERVICE_FEE_BPS: ${SERVICE_FEE_BPS:-0}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      MAYAN_API_KEY: ${MAYAN_API_KEY:-}
      THORNODE_URL: ${THORNODE_URL:-https://thornode.thorchain.network}
      THORNODE_CLIENT_ID: ${THORNODE_CLIENT_ID:-wxmr}
      CHAINFLIP_BACKEND_URL: ${CHAINFLIP_BACKEND_URL:-https://chainflip-swap.chainflip.io}
      EVM_HOTWALLET_PRIVATE_KEY: ${EVM_HOTWALLET_PRIVATE_KEY:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      BSC_RPC_URL: ${BSC_RPC_URL:-}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      OPTIMISM_RPC_URL: ${OPTIMISM_RPC_URL:-}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      AVALANCHE_RPC_URL: ${AVALANCHE_RPC_URL:-}
      LINEA_RPC_URL: ${LINEA_RPC_URL:-}
      HYPEREVM_RPC_URL: ${HYPEREVM_RPC_URL:-}
      MONAD_RPC_URL: ${MONAD_RPC_URL:-}
    volumes:
      - orchestrator-data:/data
    ports:
      - "127.0.0.1:3002:3002"

  orchestrator-worker:
    image: wxmr-orchestrator
    restart: unless-stopped
    env_file:
      - ../.env
    command: ["node", "dist/worker.js"]
    depends_on:
      - orchestrator
    environment:
      ORCH_DB_PATH: /data/orchestrator.sqlite
      SOLANA_HOTWALLET_SECRET: ${SOLANA_HOTWALLET_SECRET:?SOLANA_HOTWALLET_SECRET is required}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      BRIDGE_PROGRAM_ID: ${BRIDGE_PROGRAM_ID:-EzBkC8P5wxab9kwrtV5hRdynHAfB5w3UPcPXNgMseVA8}
      SERVICE_FEE_BPS: ${SERVICE_FEE_BPS:-0}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      MAYAN_API_KEY: ${MAYAN_API_KEY:-}
      THORNODE_URL: ${THORNODE_URL:-https://thornode.thorchain.network}
      THORNODE_CLIENT_ID: ${THORNODE_CLIENT_ID:-wxmr}
      CHAINFLIP_BACKEND_URL: ${CHAINFLIP_BACKEND_URL:-https://chainflip-swap.chainflip.io}
      EVM_HOTWALLET_PRIVATE_KEY: ${EVM_HOTWALLET_PRIVATE_KEY:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
    volumes:
      - orchestrator-data:/data

volumes:
  orchestrator-data:
