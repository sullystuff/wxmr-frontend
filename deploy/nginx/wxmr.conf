# Reverse proxy for the wXMR apps.
# wxmr.io       -> bridge container (127.0.0.1:3000)
# swap.wxmr.io  -> swap container   (127.0.0.1:3001)
#
# TLS is omitted here; terminate it with certbot/your existing config and
# redirect :80 -> :443 as usual. Drop this file in /etc/nginx/sites-available
# (or /etc/nginx/conf.d) and reload nginx.

upstream wxmr_bridge {
    server 127.0.0.1:3000;
}

upstream wxmr_swap {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name wxmr.io www.wxmr.io;

    location / {
        proxy_pass http://wxmr_bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name swap.wxmr.io;

    location / {
        proxy_pass http://wxmr_swap;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
